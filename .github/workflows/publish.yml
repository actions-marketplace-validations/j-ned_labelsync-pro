# Publishes the package to GitHub Packages, so it shows up on the repository page.
# The npmjs.com package is published by hand (npm publish).
name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: 📦 Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@j-ned'
      - run: npm test
      # GitHub Packages only accepts names scoped to the repository owner.
      - run: npm pkg set name=@j-ned/labelsync-pro
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
